<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>舞台开始菜单设计远景 · 六种风格（含现状基线）</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0e14; }
  body { font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans CJK SC", sans-serif; }

  .group { display: block; }
  .tile { width: 1280px; background: #0b0e14; }
  .cap {
    display: flex; align-items: baseline; gap: 12px;
    padding: 12px 20px 8px; background: #11151d; color: #e8eef7;
    border-bottom: 1px solid rgba(255,255,255,.07);
  }
  .cap b { font-size: 15px; letter-spacing: .04em; }
  .cap span { font-size: 11.5px; color: #8b98ab; letter-spacing: .04em; }
  .cap i { margin-left: auto; font-style: normal; font-size: 11px; color: #5d6b80; letter-spacing: .12em; }

  .screen { position: relative; width: 1280px; height: 720px; overflow: hidden; }
  .art { position: absolute; inset: 0; background: url(../../../library/backgrounds/bg_cherry_blossom_street/bg_cherry_blossom_street.jpg) center 40% / cover no-repeat; }
  .back {
    position: absolute; top: 22px; left: 24px; display: flex; align-items: center; gap: 6px;
    padding: 5px 12px 5px 10px; border-radius: 999px; font-size: 12.5px;
  }
  .brand h1 { margin: 0; }
  .brand p { margin: 0; }
  .menu { display: flex; flex-direction: column; }
  .item { display: flex; align-items: center; cursor: pointer; }
  .foot { position: absolute; left: 34px; right: 34px; bottom: 20px; display: flex; align-items: center; justify-content: space-between; font-size: 11px; letter-spacing: .08em; }

  /* 主题色：与 messages 那份同一批值（playTheme.ts 的色板 + liftForDark） */
  .tile { --accent: #1b5aa6; }
  .tile[data-accent="sakura"] { --accent: #c2557f; }
  .tile[data-accent="moss"] { --accent: #4a6f45; }
  .tile[data-theme="dark"] { --accent: #4a9fe0; }
  .tile[data-theme="dark"][data-accent="sakura"] { --accent: #cf7a9b; }
  .tile[data-theme="dark"][data-accent="moss"] { --accent: #728f6e; }

  /* ══ M0 · 现状：ATRI 标题菜单（默认档） ═════════════════════════════ */
  .m0 .brand { position: absolute; left: 13.5%; top: 19%; max-width: 560px; }
  .m0 .brand h1 { font-size: clamp(30px, 3.1vw, 46px); font-weight: 800; letter-spacing: .04em; line-height: 1.35; }
  .m0 .brand p { margin-top: 12px; font-size: 12.5px; line-height: 1.8; }
  .m0 .menu { position: absolute; left: 13.5%; top: 46%; align-items: flex-start; gap: 7px; }
  .m0 .item { gap: 14px; padding: 2px 0; opacity: .5; }
  .m0 .item.on { opacity: 1; transform: translateX(8px); }
  .m0 .lb { font-size: clamp(20px, 1.85vw, 30px); font-weight: 700; letter-spacing: .08em; color: color-mix(in srgb, var(--accent) 84%, #06121f); }
  .m0 .sb { font-size: 11px; font-weight: 500; letter-spacing: .12em; opacity: 0; }
  .m0 .item.on .sb { opacity: 1; }
  .m0 .item { position: relative; }
  .m0 .item.on::before {
    content: ""; position: absolute; left: -20px; top: 50%; width: 7px; height: 7px;
    transform: translateY(-50%) rotate(45deg);
    background: color-mix(in srgb, var(--accent) 50%, #7cc4ff);
    box-shadow: 0 0 8px color-mix(in srgb, var(--accent) 45%, #7cc4ff), 0 0 2px #fff;
  }
  .m0[data-theme="dark"] .art { filter: saturate(.9) brightness(.62); }
  .m0[data-theme="dark"] .veil { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(6,10,18,.82), rgba(6,10,18,.34) 60%, rgba(6,10,18,.5)); }
  .m0[data-theme="dark"] .brand h1 { color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .m0[data-theme="dark"] .brand p { color: rgba(255,255,255,.62); }
  .m0[data-theme="dark"] .lb { text-shadow: 0 0 1px #fff, 0 0 6px rgba(255,255,255,.95), 0 0 20px color-mix(in srgb, var(--accent) 45%, transparent); }
  .m0[data-theme="dark"] .sb { color: color-mix(in srgb, var(--accent) 30%, #cbd5e1); text-shadow: 0 0 4px #fff; }
  .m0[data-theme="dark"] .back { background: rgba(8,14,24,.5); border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.8); }
  .m0[data-theme="dark"] .foot { color: rgba(255,255,255,.34); }

  .m0[data-theme="light"] .art { filter: saturate(1) brightness(1.05); }
  .m0[data-theme="light"] .veil { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(255,255,255,.9), rgba(255,255,255,.5) 60%, rgba(255,255,255,.7)); }
  .m0[data-theme="light"] .brand h1 { color: #16202e; }
  .m0[data-theme="light"] .brand p { color: rgba(22,32,46,.66); }
  .m0[data-theme="light"] .lb { color: color-mix(in srgb, var(--accent) 88%, #0d2338); text-shadow: 0 1px 0 #fff, 0 0 6px rgba(255,255,255,.9); }
  .m0[data-theme="light"] .sb { color: color-mix(in srgb, var(--accent) 40%, #33415a); text-shadow: 0 1px 0 #fff; }
  .m0[data-theme="light"] .back { background: rgba(255,255,255,.72); border: 1px solid rgba(15,23,42,.1); color: #33415a; }
  .m0[data-theme="light"] .foot { color: rgba(22,32,46,.42); }

  /* ══ M1 · 玻璃卡菜单 ═══════════════════════════════════════════════ */
  .m1 .brand { position: absolute; left: 76px; top: 40%; width: 430px; }
  .m1 .brand h1 { font-size: 44px; font-weight: 800; line-height: 1.28; letter-spacing: .01em; }
  .m1 .brand p { margin-top: 16px; font-size: 13.5px; line-height: 1.85; }
  .m1 .menu {
    position: absolute; right: 76px; top: 50%; transform: translateY(-50%);
    width: 344px; padding: 16px; border-radius: 20px; gap: 4px;
    backdrop-filter: blur(20px) saturate(1.3);
  }
  .m1 .item { justify-content: space-between; padding: 12px 16px; border-radius: 12px; }
  .m1 .lb { font-size: 15px; font-weight: 700; letter-spacing: .16em; }
  .m1 .sb { font-size: 12px; }
  .m1 .item.on { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 88%, #ffffff), var(--accent)); color: #fff; box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent); }
  .m1 .item.on .sb { color: rgba(255,255,255,.78); }
  .m1[data-theme="dark"] .art { filter: saturate(.92) brightness(.62); }
  .m1[data-theme="dark"] .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,10,18,.86) 0%, rgba(6,10,18,.42) 46%, rgba(6,10,18,.18) 100%); }
  .m1[data-theme="dark"] .back { background: rgba(8,14,24,.5); border: 1px solid rgba(255,255,255,.16); color: rgba(255,255,255,.8); backdrop-filter: blur(8px); }
  .m1[data-theme="dark"] .brand h1 { color: #fff; text-shadow: 0 2px 18px rgba(0,0,0,.6); }
  .m1[data-theme="dark"] .brand p { color: rgba(255,255,255,.7); }
  .m1[data-theme="dark"] .menu { background: linear-gradient(180deg, rgba(22,30,43,.80), rgba(10,16,26,.88)); border: 1px solid rgba(255,255,255,.16); box-shadow: 0 26px 60px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.22); }
  .m1[data-theme="dark"] .item { color: rgba(226,232,240,.78); }
  .m1[data-theme="dark"] .sb { color: rgba(226,232,240,.45); }
  .m1[data-theme="dark"] .foot { color: rgba(255,255,255,.34); }

  .m1[data-theme="light"] .art { filter: saturate(1) brightness(1.04); }
  .m1[data-theme="light"] .veil { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(255,255,255,.92) 0%, rgba(255,255,255,.6) 46%, rgba(255,255,255,.24) 100%); }
  .m1[data-theme="light"] .back { background: rgba(255,255,255,.72); border: 1px solid rgba(15,23,42,.1); color: #33415a; }
  .m1[data-theme="light"] .brand h1 { color: #16202e; }
  .m1[data-theme="light"] .brand p { color: #4b5a70; }
  .m1[data-theme="light"] .menu { background: linear-gradient(180deg, rgba(255,255,255,.95), rgba(243,247,252,.97)); border: 1px solid rgba(15,23,42,.09); box-shadow: 0 26px 56px rgba(15,23,42,.2), inset 0 1px 0 rgba(255,255,255,.9); }
  .m1[data-theme="light"] .item { color: #2c3a4e; }
  .m1[data-theme="light"] .sb { color: rgba(51,65,85,.5); }
  .m1[data-theme="light"] .foot { color: rgba(22,32,46,.4); }

  /* ══ M2 · 宽银幕字幕菜单 ═══════════════════════════════════════════ */
  .m2 .bar { position: absolute; left: 0; right: 0; }
  .m2 .bar.top { top: 0; height: 8%; }
  .m2 .bar.bottom { bottom: 0; height: 46%; }
  .m2 .brand { position: absolute; left: 0; right: 0; top: 13%; text-align: center; --film: color-mix(in srgb, var(--accent) 55%, #e8c9a0); }
  .m2 .brand h1 { font-size: 38px; font-weight: 500; letter-spacing: .16em; text-indent: .16em; }
  .m2 .rule { width: 48px; height: 1px; margin: 18px auto 14px; background: var(--film); }
  .m2 .brand p { font-size: 12.5px; letter-spacing: .06em; }
  .m2 .menu { position: absolute; left: 0; right: 0; bottom: 9%; align-items: center; gap: 0; }
  .m2 .item { flex-direction: column; gap: 2px; padding: 6px 0; }
  .m2 .lb { font-size: 16px; font-weight: 500; letter-spacing: .38em; text-indent: .38em; }
  .m2 .sb { font-size: 10.5px; letter-spacing: .22em; text-indent: .22em; }
  .m2 .item.on .lb { font-weight: 700; color: var(--film); }
  .m2 .item.on .lb::before { content: "—— "; }
  .m2 .item.on .lb::after { content: " ——"; }
  .m2 .item.on .sb { color: color-mix(in srgb, var(--film) 80%, transparent); }
  .m2 .foot { left: 0; right: 0; bottom: 16px; justify-content: center; gap: 28px; }

  .m2[data-theme="dark"] .art { filter: saturate(.85) brightness(.66); }
  .m2[data-theme="dark"] .veil { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 22%, rgba(0,0,0,.62), rgba(0,0,0,.78)); }
  .m2[data-theme="dark"] .bar.top { background: linear-gradient(180deg, rgba(0,0,0,.9), rgba(0,0,0,.2)); }
  .m2[data-theme="dark"] .bar.bottom { background: linear-gradient(0deg, rgba(0,0,0,.95) 62%, rgba(0,0,0,.82) 82%, rgba(0,0,0,0)); }
  .m2[data-theme="dark"] .back { background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.18); color: rgba(255,255,255,.78); }
  .m2[data-theme="dark"] .brand h1 { color: #f4f1ec; text-shadow: 0 2px 20px rgba(0,0,0,.85), 0 1px 2px rgba(0,0,0,.9); }
  .m2[data-theme="dark"] .brand p { color: rgba(255,255,255,.56); }
  .m2[data-theme="dark"] .item { color: rgba(255,255,255,.72); }
  .m2[data-theme="dark"] .foot { color: rgba(255,255,255,.34); }

  .m2[data-theme="light"] .art { filter: saturate(1.02) brightness(1.06); }
  .m2[data-theme="light"] .veil { position: absolute; inset: 0; background: radial-gradient(120% 80% at 50% 22%, rgba(255,255,255,.7), rgba(255,255,255,.86)); }
  .m2[data-theme="light"] .bar.top { background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.25)); }
  .m2[data-theme="light"] .bar.bottom { background: linear-gradient(0deg, rgba(255,255,255,.99) 62%, rgba(255,255,255,.94) 82%, rgba(255,255,255,0)); }
  .m2[data-theme="light"] .back { background: rgba(255,255,255,.74); border: 1px solid rgba(15,23,42,.1); color: #33415a; }
  .m2[data-theme="light"] .brand h1 { color: #14161a; text-shadow: 0 1px 0 rgba(255,255,255,.9); }
  .m2[data-theme="light"] .brand p { color: rgba(20,22,26,.68); }
  .m2[data-theme="light"] .item { color: rgba(20,22,26,.68); }
  .m2[data-theme="light"] .item.on .lb { color: color-mix(in srgb, var(--accent) 62%, #6d4a18); }
  .m2[data-theme="light"] .foot { color: rgba(20,22,26,.42); }

  /* ══ M3 · 战术 HUD 菜单 ════════════════════════════════════════════ */
  .m3 { font-family: "JetBrains Mono", ui-monospace, "SFMono-Regular", monospace; }
  .m3 .brand { position: absolute; left: 64px; top: 22%; width: 560px; }
  .m3 .brand h1 { font-size: 30px; font-weight: 700; letter-spacing: .04em; line-height: 1.35; }
  .m3 .tag { font-size: 10.5px; letter-spacing: .22em; margin-bottom: 12px; }
  .m3 .brand p { margin-top: 14px; font-size: 12px; line-height: 1.8; letter-spacing: .02em; }
  .m3 .menu {
    position: absolute; right: 60px; top: 50%; transform: translateY(-50%);
    width: 448px; padding: 1.5px; gap: 0;
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%, 0 18px);
    --hud: color-mix(in srgb, var(--accent) 62%, #46d6ff);
  }
  .m3 .menu-in { padding: 10px; display: flex; flex-direction: column; gap: 2px; clip-path: polygon(17px 0, 100% 0, 100% calc(100% - 17px), calc(100% - 17px) 100%, 0 100%, 0 17px); }
  .m3 .item { gap: 14px; padding: 11px 14px; font-size: 14px; letter-spacing: .16em; }
  .m3 .item .no { font-size: 11px; opacity: .75; }
  .m3 .item .lb { font-weight: 600; }
  .m3 .item .sb { margin-left: auto; font-family: system-ui, "PingFang SC", sans-serif; font-size: 11px; letter-spacing: .06em; }
  .m3 .item.on { background: var(--hud); color: #04121e; box-shadow: 0 0 22px color-mix(in srgb, var(--hud) 45%, transparent); }
  .m3 .foot { font-size: 10.5px; letter-spacing: .16em; }

  .m3[data-theme="dark"] .art { filter: saturate(.6) brightness(.44); }
  .m3[data-theme="dark"] .veil {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, transparent) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, rgba(3,10,18,.9), rgba(3,10,18,.62) 60%, rgba(3,10,18,.78));
  }
  .m3[data-theme="dark"] .back { background: rgba(4,16,26,.72); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); color: color-mix(in srgb, var(--accent) 55%, #cfefff); }
  .m3[data-theme="dark"] .tag { color: color-mix(in srgb, var(--accent) 60%, #7dd3fc); }
  .m3[data-theme="dark"] .brand h1 { color: #e0f2fe; text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 40%, transparent); }
  .m3[data-theme="dark"] .brand p { color: rgba(186,230,253,.6); }
  .m3[data-theme="dark"] .menu { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 62%, transparent), color-mix(in srgb, var(--accent) 16%, transparent)); }
  .m3[data-theme="dark"] .menu-in { background: linear-gradient(180deg, rgba(8,20,32,.94), rgba(4,11,20,.96)); }
  .m3[data-theme="dark"] .item { color: rgba(186,230,253,.72); }
  .m3[data-theme="dark"] .foot { color: color-mix(in srgb, var(--accent) 55%, #7dd3fc); }

  .m3[data-theme="light"] .art { filter: saturate(.7) brightness(1.1); }
  .m3[data-theme="light"] .veil {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, transparent) 0 1px, transparent 1px 3px),
      linear-gradient(90deg, rgba(255,255,255,.94), rgba(255,255,255,.72) 60%, rgba(240,247,252,.86));
  }
  .m3[data-theme="light"] .back { background: rgba(255,255,255,.8); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); color: color-mix(in srgb, var(--accent) 70%, #0b3b57); }
  .m3[data-theme="light"] .tag { color: color-mix(in srgb, var(--accent) 65%, #0c4a6e); }
  .m3[data-theme="light"] .brand h1 { color: #0f2a3d; }
  .m3[data-theme="light"] .brand p { color: rgba(15,42,61,.66); }
  .m3[data-theme="light"] .menu { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 50%, transparent), color-mix(in srgb, var(--accent) 16%, transparent)); }
  .m3[data-theme="light"] .menu-in { background: linear-gradient(180deg, rgba(255,255,255,.97), rgba(241,247,252,.98)); }
  .m3[data-theme="light"] .item { color: rgba(15,42,61,.72); }
  .m3[data-theme="light"] .item.on { color: #fff; background: color-mix(in srgb, var(--accent) 78%, #0e74a4); }
  .m3[data-theme="light"] .foot { color: color-mix(in srgb, var(--accent) 60%, #0c4a6e); }

  /* ══ M4 · 书卷目录 ═════════════════════════════════════════════════ */
  .m4 { font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif; }
  .m4 .frame { position: absolute; inset: 26px; border: 1px solid currentColor; opacity: .55; }
  .m4 .frame::after { content: ""; position: absolute; inset: 7px; border: 1px solid currentColor; }
  .m4 .brand { position: absolute; left: 92px; top: 24%; width: 330px; }
  .m4 .brand h1 { font-size: 34px; font-weight: 600; line-height: 1.6; letter-spacing: .12em; writing-mode: vertical-rl; height: 430px; }
  .m4 .marque { position: absolute; left: 96px; bottom: 108px; width: 34px; height: 34px; display: grid; place-items: center; font-size: 11px; letter-spacing: .04em; font-weight: 700; }
  .m4 .menu { position: absolute; right: 96px; top: 34%; width: 430px; }
  .m4 .item { gap: 14px; padding: 13px 6px; }
  .m4 .item + .item { border-top: 1px solid currentColor; }
  .m4 .dot { width: 7px; height: 7px; transform: rotate(45deg); background: transparent; }
  .m4 .lb { font-size: 16px; letter-spacing: .2em; }
  .m4 .sb { margin-left: auto; font-size: 12.5px; letter-spacing: .14em; }
  .m4 .foot { font-size: 11px; letter-spacing: .12em; }

  .m4[data-theme="dark"] .art { filter: saturate(.7) brightness(.5) sepia(.18); }
  .m4[data-theme="dark"] .veil { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(20,16,11,.94), rgba(20,16,11,.74) 55%, rgba(26,20,14,.86)); color: color-mix(in srgb, var(--accent) 35%, rgba(206,176,124,.6)); }
  .m4[data-theme="dark"] .back { background: rgba(28,22,15,.8); border: 1px solid color-mix(in srgb, var(--accent) 40%, rgba(206,176,124,.4)); color: color-mix(in srgb, var(--accent) 35%, #d9c49a); }
  .m4[data-theme="dark"] .brand h1 { color: #ece2d1; text-shadow: 0 2px 14px rgba(0,0,0,.7); }
  .m4[data-theme="dark"] .marque { background: color-mix(in srgb, var(--accent) 45%, #8c2f22); color: #f6e9dd; }
  .m4[data-theme="dark"] .item { color: rgba(236,226,209,.72); }
  .m4[data-theme="dark"] .dot { border: 1px solid color-mix(in srgb, var(--accent) 40%, rgba(206,176,124,.6)); }
  .m4[data-theme="dark"] .item.on { color: #f3e6cd; }
  .m4[data-theme="dark"] .item.on .dot { background: color-mix(in srgb, var(--accent) 45%, #c8553d); border-color: transparent; }
  .m4[data-theme="dark"] .item.on .lb { font-weight: 700; }
  .m4[data-theme="dark"] .sb { color: color-mix(in srgb, var(--accent) 30%, rgba(217,196,154,.7)); }
  .m4[data-theme="dark"] .foot { color: rgba(217,196,154,.5); }

  .m4[data-theme="light"] .art { filter: saturate(.8) brightness(1.02) sepia(.12); }
  .m4[data-theme="light"] .veil { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(250,244,231,.95), rgba(250,244,231,.8) 55%, rgba(246,238,224,.9)); color: color-mix(in srgb, var(--accent) 35%, rgba(133,98,54,.5)); }
  .m4[data-theme="light"] .back { background: rgba(255,255,255,.72); border: 1px solid color-mix(in srgb, var(--accent) 40%, rgba(133,98,54,.35)); color: color-mix(in srgb, var(--accent) 55%, #6b4a24); }
  .m4[data-theme="light"] .brand h1 { color: #3a3126; }
  .m4[data-theme="light"] .marque { background: color-mix(in srgb, var(--accent) 55%, #b3372f); color: #fdf3ec; }
  .m4[data-theme="light"] .item { color: rgba(58,49,38,.72); }
  .m4[data-theme="light"] .dot { border: 1px solid color-mix(in srgb, var(--accent) 40%, rgba(133,98,54,.55)); }
  .m4[data-theme="light"] .item.on { color: #241d14; }
  .m4[data-theme="light"] .item.on .dot { background: color-mix(in srgb, var(--accent) 55%, #b3372f); border-color: transparent; }
  .m4[data-theme="light"] .item.on .lb { font-weight: 700; }
  .m4[data-theme="light"] .sb { color: color-mix(in srgb, var(--accent) 45%, rgba(107,74,36,.8)); }
  .m4[data-theme="light"] .foot { color: rgba(107,74,36,.6); }

  /* ══ M5 · 幕布开演布告 ═════════════════════════════════════════════ */
  .m5 .curtain { position: absolute; inset: 0; }
  .m5 .plate {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 720px; padding: 52px 60px 46px; text-align: center;
    --velvet: color-mix(in srgb, var(--accent) 40%, #d8b25e);
  }
  .m5 .plate::before { content: ""; position: absolute; inset: 10px; border: 1px solid currentColor; opacity: .5; }
  .m5 .brand h1 { font-size: 34px; font-weight: 600; letter-spacing: .08em; line-height: 1.5; }
  .m5 .orn { display: flex; align-items: center; justify-content: center; gap: 12px; margin: 16px 0 10px; }
  .m5 .orn i { display: block; width: 6px; height: 6px; transform: rotate(45deg); }
  .m5 .orn s { display: block; width: 118px; height: 1px; text-decoration: none; }
  .m5 .brand p { font-size: 12.5px; letter-spacing: .06em; }
  .m5 .menu { margin-top: 30px; gap: 3px; align-items: center; }
  .m5 .item { gap: 12px; padding: 8px 26px; border-radius: 999px; }
  .m5 .lb { font-size: 14px; letter-spacing: .26em; }
  .m5 .sb { font-size: 11.5px; letter-spacing: .1em; opacity: .7; }
  .m5 .item.on { background: linear-gradient(180deg, color-mix(in srgb, var(--velvet) 70%, #fff), var(--velvet)); color: #2a0a14; font-weight: 700; border-color: transparent; }
  .m5 .item.on .sb { opacity: .85; }

  .m5[data-theme="dark"] .curtain {
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 22px, rgba(0,0,0,.06) 22px 44px),
      radial-gradient(120% 100% at 50% 42%, color-mix(in srgb, var(--accent) 22%, rgba(48,10,22,.6)), color-mix(in srgb, var(--accent) 14%, rgba(28,6,13,.92)) 70%);
  }
  .m5[data-theme="dark"] .art { filter: saturate(.75) brightness(.5); }
  .m5[data-theme="dark"] .plate { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 20%, #3a0c1a), color-mix(in srgb, var(--accent) 15%, #220710)); border: 1px solid color-mix(in srgb, var(--velvet) 60%, transparent); box-shadow: 0 30px 70px rgba(0,0,0,.6), inset 0 1px 0 color-mix(in srgb, var(--velvet) 35%, transparent); color: color-mix(in srgb, var(--velvet) 60%, transparent); }
  .m5[data-theme="dark"] .back { background: rgba(40,8,18,.72); border: 1px solid color-mix(in srgb, var(--velvet) 45%, transparent); color: var(--velvet); }
  .m5[data-theme="dark"] .brand h1 { color: #f7ece6; text-shadow: 0 2px 16px rgba(0,0,0,.7); }
  .m5[data-theme="dark"] .orn i { background: var(--velvet); box-shadow: 0 0 8px color-mix(in srgb, var(--velvet) 70%, transparent); }
  .m5[data-theme="dark"] .orn s { background: linear-gradient(90deg, transparent, var(--velvet), transparent); }
  .m5[data-theme="dark"] .brand p { color: rgba(247,236,230,.6); }
  .m5[data-theme="dark"] .item { color: var(--velvet); border: 1px solid color-mix(in srgb, var(--velvet) 30%, transparent); }
  .m5[data-theme="dark"] .foot { color: color-mix(in srgb, var(--velvet) 60%, transparent); }

  .m5[data-theme="light"] .curtain {
    background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--accent) 6%, transparent) 0 22px, rgba(120,90,50,.05) 22px 44px),
      radial-gradient(120% 100% at 50% 42%, color-mix(in srgb, var(--accent) 6%, rgba(255,250,240,.92)), color-mix(in srgb, var(--accent) 10%, rgba(244,233,216,.95)) 70%);
  }
  .m5[data-theme="light"] .art { filter: saturate(.95) brightness(1.08); opacity: .32; }
  .m5[data-theme="light"] .plate { background: linear-gradient(180deg, color-mix(in srgb, var(--accent) 6%, rgba(255,252,246,.97)), color-mix(in srgb, var(--accent) 10%, rgba(247,238,224,.97))); border: 1px solid color-mix(in srgb, var(--velvet) 55%, transparent); box-shadow: 0 28px 60px rgba(70,50,20,.24), inset 0 1px 0 rgba(255,255,255,.9); color: color-mix(in srgb, var(--velvet) 55%, transparent); }
  .m5[data-theme="light"] .back { background: rgba(255,255,255,.76); border: 1px solid color-mix(in srgb, var(--velvet) 40%, transparent); color: color-mix(in srgb, var(--accent) 55%, #7a5320); }
  .m5[data-theme="light"] .brand h1 { color: #3d2b22; }
  .m5[data-theme="light"] .orn i { background: var(--velvet); }
  .m5[data-theme="light"] .orn s { background: linear-gradient(90deg, transparent, var(--velvet), transparent); }
  .m5[data-theme="light"] .brand p { color: rgba(61,43,34,.66); }
  .m5[data-theme="light"] .item { color: color-mix(in srgb, var(--accent) 55%, #7a5320); border: 1px solid color-mix(in srgb, var(--velvet) 35%, transparent); }
  .m5[data-theme="light"] .item.on { color: #fff; }
  .m5[data-theme="light"] .foot { color: color-mix(in srgb, var(--accent) 45%, rgba(120,84,40,.7)); }
</style>
</head>
<body>
<div id="board"></div>
<script>
const TITLE = "和我玩怪猎的网友竟然都是美少女？";
const PREMISE = "在怪物猎人里并肩狩猎了一年的固定队，今天终于要在市中心的休闲咖啡厅迎来第一次线下聚会。";
const MENUS = [
  { lb: "CONTINUE", sb: "继续游戏", on: true },
  { lb: "START", sb: "新的开始" },
  { lb: "ROUTE", sb: "路线树" },
  { lb: "WORKSHOP", sb: "工坊" },
  { lb: "SYSTEM", sb: "系统配置" },
  { lb: "EXIT", sb: "退出游戏" },
];
const VARIANTS = [
  { id: "m0", name: "现状 · ATRI 标题菜单", desc: "默认档：左侧一列纯字大标题，选中项靠字亮 + 菱形光标 + 白色外晕表态，不铺底板" },
  { id: "m1", name: "玻璃卡菜单", desc: "左侧剧名 + 右侧一张竖排玻璃卡；选中项是主题色胶囊" },
  { id: "m2", name: "宽银幕字幕菜单", desc: "剧名居中压在画面上 · 菜单落进下方黑带（与 V2 消息框同一条规矩）" },
  { id: "m3", name: "战术 HUD 菜单", desc: "左侧等宽剧名与状态标签 · 右侧切角面板带序号" },
  { id: "m4", name: "书卷目录", desc: "竖排衬线剧名 + 朱红小印 · 右侧一列细线分隔的目录" },
  { id: "m5", name: "幕布开演布告", desc: "中央金色双线告示板 · 菱形坠饰 · 金色胶囊菜单" },
];
const ACCENTS = { deepsea: "深海 #1b5aa6", sakura: "樱粉 #c2557f", moss: "苔绿 #4a6f45" };

function menuHTML(v) {
  return MENUS.map((m) => {
    const on = m.on ? " on" : "";
    if (v.id === "m3") {
      const no = String(MENUS.indexOf(m) + 1).padStart(2, "0");
      return `<div class="item${on}"><span class="no">${no}</span><span class="lb">${m.lb}</span><span class="sb">${m.sb}</span></div>`;
    }
    if (v.id === "m4") return `<div class="item${on}"><span class="dot"></span><span class="lb">${m.lb}</span><span class="sb">${m.sb}</span></div>`;
    return `<div class="item${on}"><span class="lb">${m.lb}</span><span class="sb">${m.sb}</span></div>`;
  }).join("");
}
function brandHTML(v) {
  if (v.id === "m3") return `<div class="brand"><div class="tag">// PLAY-INFO · MAIN-MENU</div><h1>${TITLE}</h1><p>${PREMISE}</p></div>`;
  if (v.id === "m4") return `<div class="brand"><h1>${TITLE}</h1></div><div class="marque">印</div>`;
  if (v.id === "m5") return `<div class="brand"><h1>${TITLE}</h1><div class="orn"><s></s><i></i><s></s></div><p>${PREMISE}</p></div>`;
  if (v.id === "m2") return `<div class="brand"><h1>${TITLE}</h1><div class="rule"></div><p>${PREMISE}</p></div>`;
  return `<div class="brand"><h1>${TITLE}</h1><p>${PREMISE}</p></div>`;
}
function sub(v) {
  const menu = `<nav class="menu">${v.id === "m3" ? `<div class="menu-in">${menuHTML(v)}</div>` : menuHTML(v)}</nav>`;
  const foot = `<footer class="foot"><span>© AIVN Studio / Engine. All rights reserved.</span><span>EXPORT　DELETE</span></footer>`;
  const back = `<div class="back">← 剧目库</div>`;
  if (v.id === "m5") return `<div class="curtain"></div><div class="plate">${brandHTML(v)}${menu}</div>${back}${foot}`;
  if (v.id === "m4") return `<div class="frame"></div>${brandHTML(v)}${menu}${back}${foot}`;
  if (v.id === "m2") return `<div class="bar top"></div><div class="bar bottom"></div>${brandHTML(v)}${menu}${back}${foot}`;
  return `${brandHTML(v)}${menu}${back}${foot}`;
}
function tile(v, theme, accent, note) {
  return `<section class="tile ${v.id}" data-variant="${v.id}" data-theme="${theme}" data-accent="${accent}">
    <div class="cap"><b>${v.id.toUpperCase()} · ${v.name}</b><span>${note ?? v.desc}</span><i>${theme.toUpperCase()} · ${ACCENTS[accent] ?? accent}</i></div>
    <div class="screen"><div class="art"></div><div class="veil"></div>${sub(v)}</div>
  </section>`;
}

const dark = VARIANTS.map((v) => tile(v, "dark", "deepsea"));
const light = VARIANTS.map((v) => tile(v, "light", "deepsea"));
const sweeps = ["m2", "m3", "m4", "m5"].map((id) => {
  const v = VARIANTS.find((x) => x.id === id);
  return `<div class="group sweep" id="sweep-${id}">${Object.keys(ACCENTS)
    .map((a) => tile(v, "dark", a, `${v.name} · 主题色换成 ${ACCENTS[a]}`))
    .join("")}</div>`;
});

document.getElementById("board").innerHTML =
  `<div class="group" id="group-dark">${dark.join("")}</div>` +
  `<div class="group" id="group-light">${light.join("")}</div>` +
  VARIANTS.map((v, i) => `<div class="group" id="combo-${v.id}">${dark[i]}${light[i]}</div>`).join("") +
  sweeps.join("");
</script>
</body>
</html>
