<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    AIVN 的记号：冷蓝底（app.css 的 accent）上，一个朝上的实心尖块叠一个朝下的。

    这是产品名的缩写：上尖块是 ^ 也是 A，下尖块是 v 也是 V，A 在上 V 在下读作 AV，
    对应 AiVn 的两个大写字母。

    为什么是实心而不是 `^` `v` 那种线条：线条在小尺寸下会断成碎点（16px 时左右两个
    断口被抗锯齿糊死，整块散架）。实心块在 16px 退化成一颗饱满的实心菱形，在
    128px 以上又能看清中间那道横缝、认出是上下两块——同一个图形随尺寸自然降级。

    缝宽 84（约 1024 的 8%）是量出来的上限：再大，24px 下就裂成两个独立小三角。
  -->
  <rect width="1024" height="1024" rx="176" fill="#3f6b93" />
  <path d="M232 470 L512 218 L792 470 Z" fill="#f7f4ec" />
  <path d="M232 554 L512 806 L792 554 Z" fill="#f7f4ec" />
</svg>
