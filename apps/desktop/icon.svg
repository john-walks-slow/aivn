<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    AIVN 的记号：冷蓝底（app.css 的 accent）上一颗纸白空心菱形。

    2026-10-04 换掉了原来那对实心尖块（上 ^ 下 v）。菱形只留轮廓，四条边等长、
    对角线与画布等分，任何尺寸下都是一个认得出的形状；尖角用默认的 miter 接头，
    不描圆角——圆角在小尺寸下会把尖角磨成一团。

    线宽 80（1024 的 7.8%）是量出来的：再细，32px 下轮廓被抗锯齿糊成一圈灰；再粗，
    孔径收得比线还窄，「空心」就白说了。顶点取 ±296，给圆角底（rx=176）留出边距。
  -->
  <rect width="1024" height="1024" rx="176" fill="#3f6b93" />
  <path d="M512 216 L808 512 L512 808 L216 512 Z" fill="none" stroke="#f7f4ec" stroke-width="80" />
</svg>
