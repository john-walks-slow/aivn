<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    AIVN 的记号：纸白底上一颗主题蓝的空心菱形。

    2026-10-04 换掉了原来那对实心尖块（上 ^ 下 v），2026-10-10 把底色与记号色对调
    （原来是冷蓝底 + 纸白菱形）：底色回到纸白，菱形取 app.css 的 accent（#1b5aa6），
    与界面里的主题色同一枚，换主题色时记号也跟着走。

    菱形只留轮廓，四条边等长；尖角用默认的 miter 接头，不描圆角——圆角在小尺寸下会把
    尖角磨成一团。横轴比纵轴收一档（255 对 296，约 0.86）成「稍瘦」的比例：等比旋转的
    正方形（0.5 对角线）在方形图标里显得矮胖。

    线宽 80（1024 的 7.8%）是量出来的：再细，32px 下轮廓被抗锯齿糊成一圈灰；再粗，
    孔径收得比线还窄，「空心」就白说了。纵向顶点取 ±296，给圆角底（rx=176）留出边距。
  -->
  <rect width="1024" height="1024" rx="176" fill="#ffffff" />
  <path d="M512 216 L767 512 L512 808 L257 512 Z" fill="none" stroke="#1b5aa6" stroke-width="80" />
</svg>
